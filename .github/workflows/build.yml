name: Сборка Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Планер для Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Проверка кода
        run: for f in src/js/*.js; do node --check "$f"; done
      - name: Модули Capacitor
        working-directory: mobile
        run: npm ci || npm install
      - name: Копирование программы в проект Android
        working-directory: mobile
        run: npx cap sync android
      - name: Ключ подписи из секретов GitHub
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Не заданы секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD — только проверочная сборка, без выпуска"
            echo "HAS_KEY=0" >> "$GITHUB_ENV"; exit 0
          fi
          echo "HAS_KEY=1" >> "$GITHUB_ENV"
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/planer.keystore"
          echo "PLANER_KEYSTORE=$RUNNER_TEMP/planer.keystore" >> "$GITHUB_ENV"
          echo "PLANER_KEYSTORE_PASSWORD=$(echo "$KS_PASS" | tr -d ' \r\n')" >> "$GITHUB_ENV"
      - name: Сборка
        working-directory: mobile/android
        run: chmod +x gradlew && if [ "$HAS_KEY" = 1 ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: Файл
        if: env.HAS_KEY == '1'
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p out && cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/Planer-$V.apk"
      - name: Выпуск
        if: env.HAS_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$V-${{ github.run_number }}"
          printf 'Телефон Android: файл Planer-%s.apk. Установка поверх прежней версии — данные сохранятся.\n' "$V" > notes.md
          gh release create "$TAG" out/*.apk --target "${{ github.sha }}" --title "Планер $V (сборка ${{ github.run_number }})" --notes-file notes.md --latest
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
