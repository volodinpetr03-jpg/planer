<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="tb">
  <div class="brand"><img src="img/icon.png" alt=""><span>Планер</span></div>
  <div class="gsearch" id="gsearch">
    <label><span id="i-search"></span><input id="q" type="search" placeholder="Поиск по задачам, проектам, операциям, тегам" aria-label="Поиск" autocomplete="off"><kbd>Ctrl F</kbd><button class="ib sm mobonly" data-act="mSearch" aria-label="Закрыть поиск" id="b-sx"></button></label>
    <div class="sres" id="sres" role="listbox"></div>
  </div>
  <button class="ib mobonly" data-act="mSearch" id="b-search" title="Поиск" aria-label="Поиск"></button>
  <button class="btn ghost qbtn" data-act="quick" id="b-quick" title="Быстрый ввод (Q)"></button>
  <button class="ib" data-act="lockNow" id="b-lock" title="Заблокировать (Ctrl+L)" aria-label="Заблокировать" style="display:none"></button>
  <button class="ib" data-act="help" id="b-help" title="Справка (F1)" aria-label="Справка"></button>
  <div class="newmenu">
    <button class="btn pri" data-act="newMenu" id="b-new" aria-haspopup="menu"></button>
    <div class="dd" id="newdd" role="menu"></div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Разделы"></nav>
  <div class="work">
    <div class="bar" id="bar"></div>
    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
<div class="sidebk" id="sidebk" data-act="sideClose"></div>
<div id="sheet" class="sheet" aria-hidden="true"></div>
<div id="modal" class="modal" aria-hidden="true"></div>
<div id="alerts" class="alerts" aria-live="assertive"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="lock" class="lock" aria-live="polite"></div>
<div id="tour" class="tour" aria-live="polite"><div id="tour-spot" class="tour-spot"></div><div id="tour-tip" class="tour-tip" role="dialog" aria-label="Руководство"></div></div>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="js/platform-android.js"></script>
<script src="js/core.js"></script>
<script src="js/smart.js"></script>
<script src="js/m-tasks.js"></script>
<script src="js/m-calendar.js"></script>
<script src="js/m-projects.js"></script>
<script src="js/m-budget.js"></script>
<script src="js/m-dashboard.js"></script>
<script src="js/m-plan.js"></script>
<script src="js/m-focus.js"></script>
<script src="js/m-habits.js"></script>
<script src="js/m-cal2.js"></script>
<script src="js/m-comments.js"></script>
<script src="js/m-notes.js"></script>
<script src="js/m-insights.js"></script>
<script src="js/m-law.js"></script>
<script src="js/m-ru.js"></script>
<script src="js/m-consult.js"></script>
<script src="js/rules.js"></script>
<script src="js/share.js"></script>
<script src="js/m-settings.js"></script>
<script src="js/help.js"></script>
<script src="js/lock.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
